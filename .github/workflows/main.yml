name: Release mosproxy from GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (默认: 自动生成，如 v2025.08.13)'
        required: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  extract:
    name: Extract mosproxy (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull image (platform ${{ matrix.platform }})
        run: |
          docker pull --platform ${{ matrix.platform }} ghcr.io/irinesistiana/mosproxy:dev

      - name: Create container and copy binary
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          CID=$(docker create --platform ${{ matrix.platform }} ghcr.io/irinesistiana/mosproxy:dev)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID":/usr/bin/mosproxy ./mosproxy-linux-${{ matrix.arch }}
          chmod +x ./mosproxy-linux-${{ matrix.arch }}
          sha256sum ./mosproxy-linux-${{ matrix.arch }} | tee mosproxy-linux-${{ matrix.arch }}.sha256

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: mosproxy-${{ matrix.arch }}
          path: |
            mosproxy-linux-${{ matrix.arch }}
            mosproxy-linux-${{ matrix.arch }}.sha256

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: extract
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          set -euo pipefail
          find dist -type f -print
          # 扁平化到 dist_root 目录
          mkdir -p dist_root
          find dist -type f -name 'mosproxy-*' -exec cp -f {} dist_root/ \;

      - name: Compute default tag if empty
        id: tag
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.tag }}" ]; then
            TAG="v$(date -u +'%Y.%m.%d')"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            dist_root/mosproxy-linux-amd64
            dist_root/mosproxy-linux-amd64.sha256
            dist_root/mosproxy-linux-arm64
            dist_root/mosproxy-linux-arm64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
