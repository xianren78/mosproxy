name: Extract mosproxy and Create Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  extract-and-release:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        architecture: [amd64, arm64]
    permissions:
      contents: write
      packages: read
    steps:
      # 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 登录 GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 拉取镜像并提取 /usr/bin/mosproxy
      - name: Extract mosproxy binary
        run: |
          docker pull ghcr.io/irinesistiana/mosproxy:dev
          docker create --name mosproxy_temp ghcr.io/irinesistiana/mosproxy:dev
          docker cp mosproxy_temp:/usr/bin/mosproxy mosproxy-${{ matrix.architecture }}
          docker rm mosproxy_temp

      # 上传提取的二进制文件作为构建产物
      - name: Upload mosproxy binary
        uses: actions/upload-artifact@v4
        with:
          name: mosproxy-${{ matrix.architecture }}
          path: mosproxy-${{ matrix.architecture }}
          retention-days: 1

      # 创建 Release 并上传二进制文件
      - name: Create Release and Upload Assets
        if: matrix.runner == 'ubuntu-latest'  # 仅在 amd64 运行器上创建 Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Mosproxy binary extracted from ghcr.io/irinesistiana/mosproxy:dev for multiple architectures.
        continue-on-error: true

      # 下载并上传 arm64 二进制文件到 Release
      - name: Upload arm64 binary to Release
        if: matrix.runner == 'ubuntu-24.04-arm'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: mosproxy-arm64
          asset_name: mosproxy-arm64
          asset_content_type: application/octet-stream

      # 下载并上传 amd64 二进制文件到 Release
      - name: Upload amd64 binary to Release
        if: matrix.runner == 'ubuntu-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: mosproxy-amd64
          asset_name: mosproxy-amd64
          asset_content_type: application/octet-stream
